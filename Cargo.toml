[package]
name = "aws-google-oidc"
version = "0.1.0"
edition = "2024"
description = "Exchange Google OIDC tokens for temporary AWS credentials through STS"
repository = "https://github.com/dialohq/aws-google-oidc"
homepage = "https://dialohq.github.io/aws-google-oidc/"
readme = "README.md"

[dependencies]
aws-config = "1.11.0"
aws-sdk-sts = "1.113.0"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
keyring = "4.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
