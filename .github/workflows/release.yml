name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CC_x86_64_unknown_linux_musl: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc

jobs:
  build:
    name: Build release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: aarch64-linux
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v${package_version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${package_version}" >&2
            exit 1
          }
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if readelf -l "target/${{ matrix.target }}/release/aws-google-oidc" | grep -q INTERP; then
            echo "Linux release binary is dynamically linked" >&2
            exit 1
          fi
      - name: Package
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/aws-google-oidc"
          archive="aws-google-oidc-${{ matrix.platform }}.tar.gz"
          mkdir -p dist/package
          strip "$binary"
          cp "$binary" dist/package/aws-google-oidc
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --force --sign - dist/package/aws-google-oidc
          fi
          tar -C dist/package -czf "dist/${archive}" aws-google-oidc
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive" > "${archive}.sha256")
          else
            (cd dist && shasum -a 256 "$archive" > "${archive}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
